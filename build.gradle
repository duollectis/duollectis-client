plugins {
	id "fabric-loom" version "${loom_version}"
}

base {
	version = project.mod_version
	group = project.maven_group
}

loom {
	accessWidenerPath = file("src/main/resources/duollectis.accesswidener")
}

// --- Компиляция APT-процессора до основного кода ---

def processorClassesDir = file("${layout.buildDirectory.get()}/processor/classes")
def processorJarFile = file("${layout.buildDirectory.get()}/processor/processor.jar")

tasks.register('compileProcessor', JavaCompile) {
	source = fileTree("src/main/java/org/duollectis/client/api/modules") {
		include "Category.java", "ModuleInfo.java", "ModuleRegistryProcessor.java"
	}
	classpath = files()
	destinationDirectory = processorClassesDir
	options.release = 21
	options.compilerArgs = ["-proc:none"]
}

tasks.register('packageProcessor', Jar) {
	dependsOn compileProcessor
	from processorClassesDir
	from("src/main/resources/META-INF/services") {
		into "META-INF/services"
	}
	destinationDirectory = processorJarFile.parentFile
	archiveFileName = "processor.jar"
}

// --- Конец блока APT ---

tasks.register('copyDependencies', Copy) {
	from configurations.runtimeClasspath
	into "${layout.buildDirectory.get()}/dependencies"
}

configurations {
	shade
}

repositories {
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:1.21.11+build.1:v2"

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modCompileOnly "maven.modrinth:sodium:mc1.21.11-0.8.7-fabric"

	// Litematica и MaLiLib — только для компиляции, не попадают в рантайм
	modCompileOnly fileTree(dir: "libs", include: ["litematica-*.jar", "malilib-*.jar"])

	shade 'io.netty:netty-handler-proxy:4.2.7.Final'
	implementation('io.netty:netty-handler-proxy:4.2.7.Final') { transitive = false }

	// Lombok: compileOnly для компилятора (видит аннотации), annotationProcessor для AP
	compileOnly "org.projectlombok:lombok:${project.lombok_version}"
	annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"

	// APT-процессор модулей: подключается как annotationProcessor после сборки JAR
	annotationProcessor files(processorJarFile)
}

afterEvaluate {
	tasks.named("compileJava") {
		dependsOn packageProcessor
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}

	from {
		configurations.shade.collect { zipTree(it) }
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
