plugins {
	id "fabric-loom" version "1.16-SNAPSHOT"
}

base {
	version = project.mod_version
	group = project.maven_group
}

loom {
	accessWidenerPath = file("src/main/resources/duollectis.accesswidener")
}

repositories {

}

// --- Компиляция APT-процессора до основного кода ---

def processorClassesDir = file("$buildDir/processor/classes")
def processorJarPath = file("$buildDir/processor/processor.jar")

tasks.register('compileProcessor', JavaCompile) {
	source = fileTree("src/main/java/org/duollectis/client/api/modules") {
		include "Category.java", "ModuleInfo.java", "ModuleRegistryProcessor.java"
	}
	classpath = files()
	destinationDirectory = processorClassesDir
	options.release = 21
	options.compilerArgs = ["-proc:none"]
}

tasks.register('packageProcessor', Jar) {
	dependsOn compileProcessor
	from processorClassesDir
	from("src/main/resources/META-INF/services") {
		into "META-INF/services"
	}
	destinationDirectory = file("$buildDir/processor")
	archiveFileName = "processor.jar"
}

// --- Конец блока APT ---

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:1.21.11+build.1:v2"

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation 'io.netty:netty-handler-proxy:4.2.7.Final'

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation fileTree("libs")

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'
	annotationProcessor files(processorJarPath)
}

tasks.named("compileJava") {
	dependsOn packageProcessor
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
